[project]
name = "reel-studio"
version = "0.1.0"
description = "Motor local do reel-studio: transforma vídeos gravados em reels verticais."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
voice = ["demucs>=4.0"]
vision = [
    "opencv-python-headless>=4.9,<5",
]

[project.scripts]
reel-studio = "reel_studio.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
